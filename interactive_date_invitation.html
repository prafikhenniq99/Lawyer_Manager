<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special Invitation ✨</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #fdf2f8 0%, #fce7f3 50%, #ede9fe 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }
        .heart-pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(3deg); }
        }
        .floating-element {
            animation: float 4s ease-in-out infinite;
        }
    </style>
</head>
<body class="flex items-center justify-center p-4 sm:p-6">

    <main class="w-full max-w-md bg-white/80 backdrop-blur-xl rounded-3xl shadow-2xl border border-white/60 p-8 text-center relative overflow-hidden transition-all duration-500">
        
        <!-- Background decorative floating circles -->
        <div class="absolute -top-12 -left-12 w-32 h-32 bg-pink-300/30 rounded-full blur-2xl pointer-events-none"></div>
        <div class="absolute -bottom-12 -right-12 w-32 h-32 bg-purple-300/30 rounded-full blur-2xl pointer-events-none"></div>

        <!-- SCREEN 1: The Invitation -->
        <div id="screen-invite" class="relative z-10 transition-opacity duration-300">
            <div class="w-20 h-20 mx-auto mb-6 bg-pink-100 rounded-full flex items-center justify-center text-4xl shadow-inner floating-element">
                💌
            </div>
            <h1 class="text-2xl sm:text-3xl font-extrabold text-gray-800 tracking-tight mb-3">
                Will you go out on a date with me?
            </h1>
            <p id="invitation-subtitle" class="text-gray-500 text-sm mb-8">
                I promise good food, great laughs, and amazing company. ✨
            </p>

            <div id="button-container" class="relative h-36 w-full flex items-center justify-center">
                <button id="yes-btn" onclick="handleYesClick()" class="absolute left-6 w-32 py-3.5 bg-gradient-to-r from-rose-500 to-pink-500 hover:from-rose-600 hover:to-pink-600 text-white font-bold rounded-2xl shadow-lg shadow-pink-500/30 transform hover:scale-105 active:scale-95 transition-all z-10">
                    Yes! 💖
                </button>
                <button id="no-btn" onclick="handleNoClick()" class="absolute right-6 w-32 py-3.5 bg-gray-100 hover:bg-gray-200 text-gray-600 font-bold rounded-2xl border border-gray-200 transition-all duration-150 z-20">
                    No 🙈
                </button>
            </div>
        </div>

        <!-- SCREEN 2: Saturday Time Picker -->
        <div id="screen-time" class="hidden opacity-0 transition-opacity duration-500 relative z-10">
            <div class="w-20 h-20 mx-auto mb-6 bg-purple-100 rounded-full flex items-center justify-center text-4xl shadow-inner floating-element">
                🌹
            </div>
            <h2 class="text-2xl sm:text-3xl font-extrabold text-gray-800 tracking-tight mb-2">
                Yay! Best decision ever! 🥰
            </h2>
            <p class="text-gray-500 text-sm mb-6">
                What time works best for you this Saturday?
            </p>

            <div class="mb-6 bg-pink-50/60 p-4 rounded-2xl border border-pink-100 inline-block w-full">
                <label for="date-time-input" class="block text-xs font-semibold uppercase tracking-wider text-pink-600 mb-2">Select Saturday Time</label>
                <input type="time" id="date-time-input" value="18:00" class="w-full bg-white border border-pink-200 rounded-xl px-4 py-3 text-lg font-bold text-gray-700 text-center shadow-sm focus:outline-none focus:ring-2 focus:ring-pink-400">
            </div>

            <button onclick="handleConfirmTime()" class="w-full py-4 bg-gradient-to-r from-rose-500 to-purple-600 hover:from-rose-600 hover:to-purple-700 text-white font-bold rounded-2xl shadow-lg shadow-purple-500/25 transform hover:scale-[1.02] active:scale-[0.98] transition-all">
                Lock It In! ✨
            </button>
        </div>

        <!-- SCREEN 3: Success Confirmation -->
        <div id="screen-success" class="hidden opacity-0 transition-opacity duration-500 relative z-10">
            <div class="w-24 h-24 mx-auto mb-6 bg-rose-100 rounded-full flex items-center justify-center text-5xl shadow-inner heart-pulse">
                🎉
            </div>
            <h2 class="text-2xl sm:text-3xl font-extrabold text-gray-800 tracking-tight mb-2">
                It's a Date! 🥂
            </h2>
            <p id="confirmation-text" class="text-gray-600 text-base mb-6 font-medium">
                Saturday at <span id="selected-time-display" class="font-bold text-pink-600">6:00 PM</span>. Can't wait!
            </p>
            <div class="p-4 bg-gray-50 rounded-2xl border border-gray-100 text-xs text-gray-400">
                Screenshot this screen or keep this tab open so we don't forget! 😉
            </div>
        </div>

    </main>

    <script>
        let noClickCount = 0;
        const noMessages = [
            "No 🙈",
            "Are you sure? 🥺",
            "Think again! 💭",
            "Wrong button! 😆",
            "Nice try! ✨",
            "Nope! 🏃‍♀️",
            "Try the pink one! 💕"
        ];

        // Helper function to check if two rectangles overlap
        function checkOverlap(rect1, rect2) {
            return !(
                rect1.right + 15 < rect2.left ||
                rect1.left > rect2.right + 15 ||
                rect1.bottom + 15 < rect2.top ||
                rect1.top > rect2.bottom + 15
            );
        }

        // Teleport the "No" button strictly on click, ensuring no overlap with "Yes"
        function handleNoClick() {
            const noBtn = document.getElementById('no-btn');
            const yesBtn = document.getElementById('yes-btn');
            const container = document.getElementById('button-container');
            const subtitle = document.getElementById('invitation-subtitle');

            // Update button text to make it playful
            noClickCount++;
            const msgIndex = Math.min(noClickCount, noMessages.length - 1);
            noBtn.textContent = noMessages[msgIndex];

            // Grow the Yes button slightly each time she clicks No
            const currentScale = 1 + (noClickCount * 0.05);
            yesBtn.style.transform = `scale(${Math.min(currentScale, 1.3)})`;

            const containerRect = container.getBoundingClientRect();
            const btnWidth = noBtn.offsetWidth;
            const btnHeight = noBtn.offsetHeight;

            // Maximum coordinate boundaries inside the container
            const maxX = containerRect.width - btnWidth - 10;
            const maxY = containerRect.height - btnHeight - 10;

            let randomX, randomY;
            let overlapping = true;
            let attempts = 0;

            // Keep generating positions until it doesn't overlap with the Yes button
            while (overlapping && attempts < 100) {
                attempts++;
                randomX = Math.floor(Math.random() * Math.max(maxX, 10));
                randomY = Math.floor(Math.random() * Math.max(maxY, 10));

                // Create tentative rect for the No button in absolute container coordinates
                const tentativeRect = {
                    left: containerRect.left + randomX,
                    right: containerRect.left + randomX + btnWidth,
                    top: containerRect.top + randomY,
                    bottom: containerRect.top + randomY + btnHeight
                };

                const yesRect = yesBtn.getBoundingClientRect();

                // Check collision
                if (!checkOverlap(tentativeRect, yesRect)) {
                    overlapping = false;
                }
            }

            // Apply new coordinates
            noBtn.style.position = 'absolute';
            noBtn.style.left = `${Math.max(0, randomX)}px`;
            noBtn.style.top = `${Math.max(0, randomY)}px`;
        }

        // Transition from Screen 1 to Screen 2 when 'Yes' is clicked
        function handleYesClick() {
            const screenInvite = document.getElementById('screen-invite');
            const screenTime = document.getElementById('screen-time');

            screenInvite.classList.add('opacity-0');
            setTimeout(() => {
                screenInvite.classList.add('hidden');
                screenTime.classList.remove('hidden');
                setTimeout(() => {
                    screenTime.classList.remove('opacity-0');
                }, 50);
            }, 300);
        }

        // Save time and transition to final success screen
        function handleConfirmTime() {
            const timeInput = document.getElementById('date-time-input').value;
            const timeDisplay = document.getElementById('selected-time-display');
            
            if (timeInput) {
                const [hours, minutes] = timeInput.split(':');
                const h = parseInt(hours, 10);
                const suffix = h >= 12 ? 'PM' : 'AM';
                const formattedHours = h % 12 === 0 ? 12 : h % 12;
                timeDisplay.textContent = `${formattedHours}:${minutes} ${suffix}`;
            }

            const screenTime = document.getElementById('screen-time');
            const screenSuccess = document.getElementById('screen-success');

            screenTime.classList.add('opacity-0');
            setTimeout(() => {
                screenTime.classList.add('hidden');
                screenSuccess.classList.remove('hidden');
                setTimeout(() => {
                    screenSuccess.classList.remove('opacity-0');
                }, 50);
            }, 300);
        }
    </script>
</body>
</html>
